name: Feature Request
description: Suggest an idea or enhancement for Finlity
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Finlity. Please avoid including real account numbers, balances, or personal financial data in this request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Is this related to something that's currently missing or frustrating?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, workarounds, or existing plugins that partially address this?
    validations:
      required: false
