name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_heroku:
        description: 'Deploy to Heroku after tests pass'
        required: false
        default: 'false'
        type: boolean

# Cancel any in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright ruff mypy pip-audit bandit
          # Type stubs for mypy (dev-only, not in runtime requirements)
          pip install types-requests types-PyYAML types-python-dateutil
          playwright install chromium --with-deps

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Build frontend
        run: |
          cd src/web
          npm ci
          npm run build

      - name: Run linter
        run: ruff check src/ --output-format=github

      - name: Type check (mypy, non-blocking)
        # TODO: Mypy gating sprint -- the codebase currently has 632 mypy
        # errors hiding behind `|| true`. Removing `|| true` would block all
        # CI today. Tracked as follow-up: triage src/api/analysis.py and
        # src/dashboard/charts.py first (highest-density files), then flip
        # this step to blocking. See report attached to the security-gates PR.
        run: mypy src/ --ignore-missing-imports --no-strict-optional || true

      - name: Security audit (pip-audit, blocking)
        # Reads .pip-audit-ignore at the repo root; each non-comment line is
        # an allowlisted CVE/GHSA/PYSEC ID. Any new vuln NOT listed there
        # fails the build. See scripts/ci-pip-audit.sh for the parsing rules.
        run: bash scripts/ci-pip-audit.sh

      - name: Static security scan (bandit, blocking on src/)
        # Two-pass scan:
        #   1. src/  -- strict, medium+ severity / medium+ confidence (-ll -ii),
        #               no skips. Findings here fail the build.
        #   2. tests/ -- permissive, allows B101 (asserts) which is idiomatic.
        # Configuration lives in .bandit.yaml at the repo root.
        run: |
          set -e
          bandit -c .bandit.yaml -r src/ -ll -ii
          bandit -c .bandit.yaml -r tests/ -ll -ii --skip B101

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PORTFOLIO_DEMO_MODE: "true"
          PORTFOLIO_TEST_MODE: "true"

      - name: Run E2E tests
        run: |
          python -m src.main --no-browser &
          sleep 5
          python scripts/test_ui.py
        env:
          PORTFOLIO_DEMO_MODE: "true"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Deploy on: 1) push to main, or 2) manual workflow_dispatch with deploy_to_heroku=true
    # Skip deploy on pull requests
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_heroku == true))

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Heroku Container Registry rejects OCI image indexes / attestation
          # manifests ("unsupported"). Emit a plain Docker v2 manifest.
          provenance: false
          sbom: false
        continue-on-error: false

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
