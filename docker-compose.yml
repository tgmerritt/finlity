services:
  portfolio:
    build: .
    image: portfolio-analyzer:latest
    container_name: portfolio-analyzer
    ports:
      - "8000:8000"
    volumes:
      # Persist data directory
      - ./data:/app/data
      # Persist config file (settings are saved here)
      - ./config.yaml:/app/config.yaml
    env_file:
      # Load API keys from .env file (create from .env.example)
      # Note: All API keys should be defined in .env file
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development mode with hot reload - use: docker-compose --profile dev up portfolio-dev
  portfolio-dev:
    build: .
    image: portfolio-analyzer:latest
    container_name: portfolio-analyzer-dev
    profiles:
      - dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for live editing
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./funds.yaml:/app/funds.yaml:ro
      # Persist data directory
      - ./data:/app/data
    env_file:
      # Load API keys from .env file
      - path: .env
        required: false
    # Use --reload for auto-restart on code changes
    command: ["python", "-m", "src.main", "--host", "0.0.0.0", "--no-browser", "--reload"]
    restart: unless-stopped
